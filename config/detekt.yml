house:
  active: true
  MaxFileLength:
    active: true
    maxLines: 400
  NoComments:
    active: true

comments:
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false
  AbsentOrWrongFileLicense:
    active: false

complexity:
