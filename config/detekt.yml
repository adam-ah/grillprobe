    thresholdInFiles: 16
    thresholdInClasses: 16
    thresholdInInterfaces: 16
    thresholdInObjects: 16
    thresholdInEnums: 16

naming:
  FunctionMinLength:
    minimumFunctionNameLength: 2

style:
  ReturnCount:
    excludeGuardClauses: true
  DataClassContainsFunctions:
    active: false
